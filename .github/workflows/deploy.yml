name: Deploy my site
# After one-click setup, every push to main redeploys the helper service (Worker) and the website (Pages).
# Each deploy runs the tests first. Copies set up by hand (Cloudflare connected to Git) have no
# CLOUDFLARE_API_TOKEN secret, so this does nothing there.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'wizard/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: github.repository != 'aangan-family/aangan'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: on
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret: Cloudflare deploys this copy from Git."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.on.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.on.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Helper service (runs its tests first)
        if: steps.on.outputs.go == 'yes'
        working-directory: reminders
        run: npm ci --no-audit --no-fund && npx wrangler deploy
      - name: Website (runs its tests first)
        if: steps.on.outputs.go == 'yes'
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Publish the website
        if: steps.on.outputs.go == 'yes'
        working-directory: reminders
        run: npx wrangler pages deploy ../web/dist --project-name "$(node ../scripts/setup.mjs --pages-name)" --branch main --commit-dirty=true
