name: backup
# Nightly encrypted backup of the family database (and the photos on Sundays), kept as private artifacts of this repo.
# Only people with access to this private repo can download them, and only someone with BACKUP_PASSPHRASE can open them.
# Secrets (repo → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL       Supabase → Connect → "Session pooler" connection string (GitHub has no IPv6, so not the direct one)
#   SUPABASE_SERVICE_KEY  the same server key the Worker uses (to copy photos)
#   BACKUP_PASSPHRASE     a long passphrase kept somewhere safe; without it the backup can't be opened
# Restore steps: docs/OPERATIONS.md → Operations → Backups.
on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 India time
  workflow_dispatch:         # Actions → backup → Run workflow (a one-off backup before a big change)
    inputs:
      photos:
        description: 'Include photos'
        type: boolean
        default: true

concurrency: backup

jobs:
  backup:
    # only in your own private copy: never on the public project or a public fork
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          for s in SUPABASE_DB_URL SUPABASE_SERVICE_KEY BACKUP_PASSPHRASE; do
            if [ -z "${!s}" ]; then echo "::error::Secret $s is not set (repo → Settings → Secrets and variables → Actions)"; exit 1; fi
          done
          if [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then echo "::error::BACKUP_PASSPHRASE should be at least 16 characters"; exit 1; fi
          # the project address comes from the session-pooler login (postgres.<project>), so it isn't written in the repo
          ref=$(printf '%s' "$SUPABASE_DB_URL" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):.*#\2#p')
          if [ -z "$ref" ]; then echo "::error::SUPABASE_DB_URL should be the session pooler string (user postgres.<project>)"; exit 1; fi
          echo "SUPABASE_URL=https://$ref.supabase.co" >> "$GITHUB_ENV"
      - name: Install the Postgres 17 tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get -o Acquire::Retries=5 update -q && sudo apt-get -o Acquire::Retries=5 install -yq postgresql-client-17
      - name: Database
        run: |
          mkdir -p backup
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -Fc -f backup/public.dump
          # sign-in accounts (emails) so members keep their logins after a restore; skipped with a warning if not permitted
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --data-only --table=auth.users --table=auth.identities --no-owner -Fc -f backup/auth.dump \
            || echo "::warning::Could not copy sign-in accounts; members would sign in again after a restore"
          ls -la backup
      - name: Photos (when asked)
        if: github.event_name == 'workflow_dispatch' && inputs.photos
        run: node scripts/backup-photos.mjs backup/photos
      - name: Photos on Sundays
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Asia/Kolkata date +%u)" = "7" ]; then node scripts/backup-photos.mjs backup/photos; else echo "photos are copied on Sundays"; fi
      - name: Encrypt
        run: |
          stamp=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          tar czf - backup | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback --passphrase-fd 3 \
            -o "fam-backup-$stamp.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup
          ls -la fam-backup-*.gpg
          if [ -d backup ]; then echo "plain copy left behind"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: fam-backup-${{ env.STAMP }}
          path: fam-backup-*.tar.gz.gpg
          retention-days: 30
          compression-level: 0
