name: project api
# Deploys the Aangan project site's helper (project/api) to Cloudflare. Only from aangan-family/aangan,
# and only once the repository has CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
    branches: [main]
    paths: ['project/api/**', '.github/workflows/project-api.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    if: github.repository == 'aangan-family/aangan'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: on
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the helper."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.on.outputs.go == 'yes'
        uses: actions/checkout@v4
      - if: steps.on.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: steps.on.outputs.go == 'yes'
        working-directory: project/api
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy | tee deploy.log
          echo "Helper address - set it as the repository variable AANGAN_API_URL:"
          grep -o 'https://[^ ]*workers.dev' deploy.log | head -1
