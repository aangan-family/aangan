name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Postgres
        run: sudo apt-get update -q && sudo apt-get install -yq postgresql
      - name: Privacy rules
        run: tests/run_rls_tests.sh
      - name: Spreadsheet and Family Echo importers
        run: npm ci && npm test
      - name: Website tests and build
        working-directory: web
        run: npm ci && npm run build   # build runs the tests first
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Reminder messages
        working-directory: reminders
        run: npm ci && npm test && npx tsc -p .
